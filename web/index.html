<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Al desplegar en una subruta (por ejemplo GitHub Pages) hay que compilar con
    --base-href "/AiKitchen/", o todos los recursos darán 404.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Descubre recetas con inteligencia artificial a partir de un nombre o de los ingredientes que tengas en casa.">
  <meta name="theme-color" content="#005AC1">

  <!-- Vista previa al compartir el enlace -->
  <meta property="og:title" content="AI Kitchen — Recetas con IA">
  <meta property="og:description" content="Descubre recetas a partir de un nombre o de los ingredientes que tengas en casa.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI Kitchen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI Kitchen — Recetas con IA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Pantalla de carga: sin ella el usuario ve un rectángulo en blanco
       durante toda la descarga del paquete de la aplicación. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fdfcff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background-color: #111318; }
      #loading .loading-text { color: #e3e2e6; }
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 250ms ease-out;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 90, 193, 0.2);
      border-top-color: #005AC1;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    #loading .loading-text {
      color: #44474e;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Quien prefiere menos movimiento no debería ver un giro constante. */
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div class="loading-text">Cargando AI Kitchen…</div>
  </div>

  <script>
    // Flutter avisa por este evento cuando ya ha pintado el primer fotograma.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('hidden');
      setTimeout(function () { loading.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
